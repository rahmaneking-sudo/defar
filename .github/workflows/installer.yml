name: Installer le site depuis le ZIP
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remettre les dossiers en place
        run: |
          set -e
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then echo "Aucun ZIP à installer."; exit 0; fi
          rm -rf /tmp/site && mkdir -p /tmp/site && unzip -q "$ZIP" -d /tmp/site
          SRC=/tmp/site
          while [ "$(ls -A "$SRC" | wc -l)" -eq 1 ] && [ -d "$SRC/$(ls -A "$SRC")" ]; do SRC="$SRC/$(ls -A "$SRC")"; done
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SRC"/. .
          git config user.name "Defar installer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Installation du site depuis $ZIP" || echo "Rien à changer"
          git push
